[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "psrunner"
dynamic = ["version"]
description = "Python SDK for PythonScriptRunner stages: typed inputs and outputs, files, secrets and logging."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "net0well" }]
keywords = ["pythonscriptrunner", "dotnet", "pipeline", "stage"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=2.0"]

[project.urls]
Repository = "https://github.com/net0well/PythonScriptRunner"

[project.scripts]
psrunner = "psrunner.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "mypy>=1.13",
  "ruff>=0.8",
  "pandas>=2.0",
]

[tool.hatch.version]
path = "src/psrunner/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/psrunner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src"]

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "numpy", "numpy.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
